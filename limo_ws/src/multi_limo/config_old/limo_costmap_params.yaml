# Global Costmap
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05
  robot_radius: 0.13   # adjust to match your Limo width/length

# Local Costmap
local_costmap:
  local_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  robot_radius: 0.13   # adjust to match your Limo footprint

# Inflation layer
inflation_layer:
  inflation_radius: 0.15
